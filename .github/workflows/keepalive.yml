name: Supabase keepalive
# Supabase Free pauses a project after 1 week without activity. This pings it
# every day so it is awake on event day. Needs two repository secrets:
#   SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  the public anon key (safe; RLS protects the data)
# Scheduled workflows run from the DEFAULT branch only, and GitHub pauses them
# after 60 days without commits — re-enable from the Actions tab if that happens.
on:
  schedule:
    - cron: '17 13 * * *' # daily, 13:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keepalive.mjs
